# Promoted from INF-4 (M5 inferred set), 2026-08-11. Restated after Max's
# M8 review: the original wording ("only the two source extractors parse
# source") described the two parsers that existed, which reads as an
# argument for a fixed pipeline. The rule that actually matters is
# ownership — one parser per language, and no layer overriding another —
# and it has to keep meaning something when the fourth language arrives.
id: I-4
statement: >-
  Each language has exactly one parser, and no language's extraction may
  override another's. Files are dispatched to their owning extractor by
  extension — Python to hobbes.extract.pysource, HCL to
  hobbes.extract.terraform, TS/JS to the tsextract helper — so no parser
  ever sees another language's source, and every other module consumes
  their already-parsed facts rather than re-deriving them. A second parse
  cannot contradict the first because it never happens; where two layers
  contribute to one graph, they merge facts and never re-interpret each
  other's.
scope: pipeline/src/hobbes
status: confirmed
compile:
  # The mechanically checkable half: nobody outside the owning extractors
  # holds a parser at all. Which files each one is handed is dispatch
  # (guarded by tests), not an import edge, so the compiled contract
  # covers ownership of the parser rather than ownership of the files.
  target: import-linter
  rule:
    kind: forbidden-import
    importers: ["*"]
    except:
      - hobbes.extract.pysource
      - hobbes.extract.terraform
    imported:
      - ext:tree_sitter
      - ext:tree_sitter_hcl
      - ext:tree_sitter_python
guarded_by:
  - pipeline/tests/test_emit.py::TestLayerOwnership::test_no_parser_sees_another_languages_files
  - pipeline/tests/test_emit.py::TestLayerOwnership::test_a_cross_layer_id_collision_is_reported
  - pipeline/tests/test_emit.py::TestLayerOwnership::test_the_same_node_from_two_layers_is_not_a_collision
  - pipeline/tests/test_emit.py::TestLayerOwnership::test_symbols_stay_unique_when_modules_collide
