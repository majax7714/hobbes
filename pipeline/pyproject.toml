[project]
name = "hobbes"
version = "0.0.1"
description = "Hobbes CLI and ingestion pipeline: extractors, invariant compiler, and the front-end to the Go policy engine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Max Marrujo" }]
dependencies = []

[project.scripts]
hobbes = "hobbes.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hobbes"]
